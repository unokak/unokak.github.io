<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Családi Videótár - Felhő Alapú Feltöltővel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- FELSŐ MENÜSOR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400">
                <i class="fa-solid fa-video mr-2"></i> Családi Videótár
            </h1>
            <div class="flex items-center space-x-3 mt-2 sm:mt-0">
                <a href="index.html" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 transition text-sm"><i class="fa-solid fa-image mr-1"></i> Fotógaléria</a>
                <span id="userDisplay" class="text-amber-300 text-sm font-semibold"></span>
                <button id="toggleUploadBtn" onclick="toggleUploadPanel()" class="hidden px-3 py-1.5 rounded bg-amber-600 hover:bg-amber-500 text-sm font-semibold transition"><i class="fa-solid fa-plus mr-1"></i> Új videó</button>
                <button id="logoutBtn" onclick="logout()" class="hidden px-3 py-1.5 rounded bg-red-600 hover:bg-red-500 text-sm transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- FŐ TARTALOM -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
        <div id="contentArea" class="hidden">
            
            <!-- ÚJ VIDEÓ FELTÖLTŐ PANEL (Rejtett alapból) -->
            <div id="uploadPanel" class="hidden bg-slate-800 border border-amber-500/50 p-6 rounded-2xl shadow-2xl mb-8">
                <h3 class="text-xl font-bold text-amber-400 mb-4"><i class="fa-solid fa-cloud-arrow-up mr-2"></i> Új videó hozzáadása (Szisztematikus kitöltés)</h3>
                <form onsubmit="handleUpload(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-xs font-medium mb-1 text-slate-300">Évszám</label>
                        <input type="text" id="vidYear" placeholder="pl. 2024" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1 text-slate-300">Kategória</label>
                        <input type="text" id="vidCategory" placeholder="pl. Zene / Sport" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1 text-slate-300">Kire vonatkozik / Név</label>
                        <input type="text" id="vidName" placeholder="pl. Ábris / Családi" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm" required>
                    </div>
                    <div class="sm:col-span-2 lg:col-span-2">
                        <label class="block text-xs font-medium mb-1 text-slate-300">Rövid leírás</label>
                        <input type="text" id="vidDesc" placeholder="pl. Zongorázik a karácsonyi ünnepségen" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm" required>
                    </div>
                    <div class="sm:col-span-2 lg:col-span-4">
                        <label class="block text-xs font-medium mb-1 text-slate-300">YouTube Link vagy ID (pl. ybXkcy9i0N0 vagy teljes link)</label>
                        <input type="text" id="vidYoutube" placeholder="https://youtu.be/..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm" required>
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2 px-4 rounded text-sm transition">Mentés a felhőbe</button>
                    </div>
                </form>
            </div>

            <!-- KERESŐ ÉS GYORSZŰRŐK -->
            <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 mb-8">
                <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div class="w-full md:w-1/2 relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="filterVideos()" placeholder="Keresés név, évszám vagy téma szerint..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2.5 text-white placeholder-slate-400 focus:outline-none focus:border-amber-400 transition">
                    </div>
                    <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                        <button onclick="quickFilter('')" class="px-3 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition">Összes</button>
                        <button onclick="quickFilter('Zene')" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Zene</button>
                        <button onclick="quickFilter('Sport')" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Sport</button>
                        <button onclick="quickFilter('Ábris')" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Ábris</button>
                        <button onclick="quickFilter('Gerda')" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Gerda</button>
                        <button onclick="quickFilter('Moira')" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition">Moira</button>
                    </div>
                </div>
            </div>

            <!-- VIDEÓK RÁCSA -->
            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="col-span-full text-center text-slate-400 py-12">Videók betöltése a felhőből...</p>
            </div>
        </div>
    </main>

    <!-- YOUTUBE LEJÁTSZÓ MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/90 hidden flex flex-col items-center justify-center z-50 p-4">
        <div class="relative w-full max-w-4xl bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-700">
            <button class="absolute top-2 right-4 text-white text-3xl hover:text-amber-400 transition z-10" onclick="closeVideoModal()">&times;</button>
            <div class="relative w-full" style="padding-top: 56.25%;">
                <iframe id="youtubeIframe" class="absolute inset-0 w-full h-full" src="" title="YouTube videó" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="p-4 bg-slate-800">
                <p id="videoModalCaption" class="text-slate-200 text-base font-medium"></p>
            </div>
        </div>
    </div>

    <!-- BEJELENTKEZÉSI MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold text-amber-400 mb-4"><i class="fa-solid fa-lock mr-2"></i> Bejelentkezés szükséges</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Felhasználónév</label>
                    <input type="text" id="loginUser" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Jelszó</label>
                    <input type="password" id="loginPass" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2 rounded transition mt-2">Belépés</button>
            </form>
        </div>
    </div>

    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-slate-400 text-sm">
        <p>&copy; 2026 Családi Videótár</p>
    </footer>

    <script>
        const BIN_ID = "6af362a2ac6210605a7dc72a";
        const API_KEY = "$2a$10$qWK3dCVPqDgz6rBchuQgceNsK3VnvrClG.B0mKPXNFdcuS/pcIYhC";
        
        let dbVideos = [];

        const validUsers = [
            { username: "admin", password: "19511955" },
            { username: "Timi", password: "Timi1976" },
            { username: "Tomi", password: "Tomi 1977" },
            { username: "Nagymama", password: "Nagymama1955" },
            { username: "Abris", password: "Abris2003" },
            { username: "Gerda", password: "Gerda2004" },
            { username: "Moira", password: "Moira2007" },
            { username: "Liviusz", password: "Liviusz1969" }
        ];

        let currentUser = null;

        // Adatok betöltése a JSONBin-ről
        async function fetchVideosFromCloud() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await response.json();
                dbVideos = data.record.videos || [];
                renderVideos(dbVideos);
            } catch (error) {
                console.error("Hiba a videók betöltésekor:", error);
                document.getElementById('videoGrid').innerHTML = `<p class="col-span-full text-center text-red-400 py-12">Nem sikerült betölteni a videókat a felhőből.</p>`;
            }
        }

        // Adatok mentése a JSONBin-re
        async function saveVideosToCloud() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ videos: dbVideos })
                });
                if (!response.ok) throw new Error("Hiba a mentés során");
            } catch (error) {
                alert("Hiba történt a felhőbe mentés közben!");
                console.error(error);
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            
            const found = validUsers.find(user => user.username === u && user.password === p);
            if (found) {
                currentUser = u;
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('userDisplay').innerText = `Bejelentkezve: ${u}`;
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('toggleUploadBtn').classList.remove('hidden');
                document.getElementById('contentArea').classList.remove('hidden');
                fetchVideosFromCloud();
            } else {
                alert("Hibás felhasználónév vagy jelszó!");
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('userDisplay').innerText = '';
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('toggleUploadBtn').classList.add('hidden');
            document.getElementById('uploadPanel').classList.add('hidden');
            document.getElementById('contentArea').classList.add('hidden');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function toggleUploadPanel() {
            const panel = document.getElementById('uploadPanel');
            panel.classList.toggle('hidden');
        }

        // YouTube linkből azonosító kinyerése
        function extractYouTubeId(urlOrId) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId;
        }

        // Új videó feltöltése az űrlapról
        async function handleUpload(event) {
            event.preventDefault();
            const year = document.getElementById('vidYear').value.trim();
            const category = document.getElementById('vidCategory').value.trim();
            const name = document.getElementById('vidName').value.trim();
            const desc = document.getElementById('vidDesc').value.trim();
            const rawYt = document.getElementById('vidYoutube').value.trim();

            const youtubeId = extractYouTubeId(rawYt);
            const caption = `${year} - ${category} - ${name} - ${desc}`;

            const newVideo = {
                id: Date.now(),
                youtubeId: youtubeId,
                caption: caption
            };

            dbVideos.push(newVideo);
            await saveVideosToCloud();

            // Mezők ürítése és panel bezárása
            document.getElementById('vidYear').value = '';
            document.getElementById('vidCategory').value = '';
            document.getElementById('vidName').value = '';
            document.getElementById('vidDesc').value = '';
            document.getElementById('vidYoutube').value = '';
            toggleUploadPanel();

            renderVideos(dbVideos);
            alert("Videó sikeresen feltöltve a felhőbe!");
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (videos.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Még nincsenek videók a tárban. Használd az "Új videó" gombot a felvételhez!</p>`;
                return;
            }

            videos.forEach(v => {
                let thumbUrl = `https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg`;
                grid.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-md flex flex-col justify-between p-4 hover:border-amber-400 transition">
                        <div>
                            <div class="relative bg-slate-950 flex items-center justify-center rounded-lg overflow-hidden h-52 cursor-pointer group" onclick="openVideoModal('${v.youtubeId}', '${v.caption}')">
                                <img src="${thumbUrl}" alt="Videó előnézet" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center group-hover:bg-black/20 transition">
                                    <div class="w-14 h-14 bg-amber-600/90 rounded-full flex items-center justify-center text-white text-xl shadow-lg transform group-hover:scale-110 transition">
                                        <i class="fa-solid fa-play ml-1"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <p class="text-slate-200 text-sm font-semibold">${v.caption}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = dbVideos.filter(v => v.caption.toLowerCase().includes(query));
            renderVideos(filtered);
        }

        function quickFilter(keyword) {
            document.getElementById('searchInput').value = keyword;
            filterVideos();
        }

        function openVideoModal(youtubeId, caption) {
            document.getElementById('youtubeIframe').src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
            document.getElementById('videoModalCaption').innerText = caption;
            document.getElementById('videoModal').classList.remove('hidden');
        }

        function closeVideoModal() {
            document.getElementById('youtubeIframe').src = '';
            document.getElementById('videoModal').classList.add('hidden');
        }
    </script>
</body>
</html>
