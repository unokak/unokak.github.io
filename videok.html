<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Családi Videótár</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- FELSŐ MENÜSOR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400">
                <i class="fa-solid fa-video mr-2"></i> Családi Videótár
            </h1>
            <div class="flex items-center space-x-3">
                <a href="index.html" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 transition text-sm"><i class="fa-solid fa-image mr-1"></i> Fotógaléria</a>
                <span id="userDisplay" class="text-amber-300 text-sm font-semibold"></span>
                <button id="logoutBtn" onclick="logout()" class="hidden px-3 py-1.5 rounded bg-red-600 hover:bg-red-500 text-sm transition">Kilépés</button>
                <button id="loginOpenBtn" onclick="openLoginModal()" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500 font-semibold transition text-sm"><i class="fa-solid fa-right-to-bracket mr-1"></i> Belépés</button>
            </div>
        </div>
    </header>

    <!-- FŐ TARTALOM -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full text-center">
        <div id="welcomeArea" class="hidden py-12">
            <div class="max-w-3xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
                <h2 class="text-3xl font-bold text-amber-400 mb-4">Üdvözlünk a videótárban!</h2>
                <p class="text-slate-300">A témákat és kategóriákat hamarosan ide tesszük be.</p>
            </div>
        </div>
    </main>

    <!-- BEJELENTKEZÉSI MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold text-amber-400 mb-4"><i class="fa-solid fa-lock mr-2"></i> Bejelentkezés szükséges</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Felhasználónév</label>
                    <input type="text" id="loginUser" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Jelszó</label>
                    <input type="password" id="loginPass" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2 rounded transition mt-2">Belépés</button>
            </form>
        </div>
    </div>

    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-slate-400 text-sm">
        <p>&copy; 2026 Családi Videótár</p>
    </footer>

    <script>
        const validUsers = [
            { username: "admin", password: "19511955" },
            { username: "Timi", password: "Timi1976" },
            { username: "Tomi", password: "Tomi 1977" },
            { username: "Nagymama", password: "Nagymama1955" },
            { username: "Abris", password: "Abris2003" },
            { username: "Gerda", password: "Gerda2004" },
            { username: "Moira", password: "Moir2007" },
            { username: "Liviusz", password: "Liviusz1969" }
        ];

        let currentUser = null;

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleLogin(event) {
            event.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            
            const found = validUsers.find(user => user.username === u && user.password === p);
            if (found) {
                currentUser = u;
                closeLoginModal();
                document.getElementById('userDisplay').innerText = `Bejelentkezve: ${u}`;
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('loginOpenBtn').classList.add('hidden');
                document.getElementById('welcomeArea').classList.remove('hidden');
            } else {
                alert("Hibás felhasználónév vagy jelszó!");
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('userDisplay').innerText = '';
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('loginOpenBtn').classList.remove('hidden');
            document.getElementById('welcomeArea').classList.add('hidden');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            openLoginModal();
        }

        // Oldal betöltésekor azonnal megnyitja a bejelentkezést
        window.onload = function() {
            openLoginModal();
        };
    </script>
</body>
</html>
