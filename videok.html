<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Családi Videótár - Témák szerint</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- FELSŐ MENÜSOR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400 cursor-pointer" onclick="showHome()">
                <i class="fa-solid fa-video mr-2"></i> Családi Videótár
            </h1>
            <nav id="mainNav" class="flex items-center space-x-2 md:space-x-4 mt-2 sm:mt-0">
                <a href="index.html" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 transition"><i class="fa-solid fa-image mr-1"></i> Fotógaléria</a>
                <button onclick="showHome()" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 transition"><i class="fa-solid fa-house mr-1"></i> Főoldal</button>
                <div id="categoryNav" class="hidden flex space-x-2"></div>
                <div id="authNav">
                    <button onclick="openLoginModal()" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500 font-semibold transition"><i class="fa-solid fa-right-to-bracket mr-1"></i> Belépés</button>
                </div>
            </nav>
        </div>
    </header>

    <!-- FŐ TARTALOMTERÜLET -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
        <div id="alertBox" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

        <!-- 1. FŐOLDAL (Kategóriák rácsai) -->
        <section id="homeView" class="text-center py-12">
            <div class="max-w-4xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
                <h2 class="text-3xl md:text-4xl font-extrabold text-amber-400 mb-4">Családi Videó Archívum</h2>
                <p id="homeSubText" class="text-slate-300 text-lg mb-8">A videók megtekintéséhez bejelentkezés szükséges.</p>
                <div id="homeCategoriesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-8 hidden"></div>
            </div>
        </section>

        <!-- 2. GALÉRIA NÉZET (Kategória és Évszűrő) -->
        <section id="galleryView" class="hidden">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-700">
                <h2 id="galleryTitle" class="text-3xl font-bold text-amber-400 mb-4 md:mb-0"></h2>
                <div id="yearFilterContainer" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <!-- YOUTUBE LEJÁTSZÓ MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/90 hidden flex flex-col items-center justify-center z-50 p-4">
        <div class="relative w-full max-w-4xl bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-700">
            <button class="absolute top-2 right-4 text-white text-3xl hover:text-amber-400 transition z-10" onclick="closeVideoModal()">&times;</button>
            <div class="relative w-full" style="padding-top: 56.25%;">
                <iframe id="youtubeIframe" class="absolute inset-0 w-full h-full" src="" title="YouTube videó" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="p-4 bg-slate-800">
                <p id="videoModalCaption" class="text-slate-200 text-base font-medium"></p>
            </div>
        </div>
    </div>

    <!-- BEJELENTKEZÉSI MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold text-amber-400 mb-4"><i class="fa-solid fa-lock mr-2"></i> Bejelentkezés szükséges</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Felhasználónév</label>
                    <input type="text" id="loginUser" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Jelszó</label>
                    <input type="password" id="loginPass" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">Mégse</button>
                    <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 font-bold rounded">Belépés</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-slate-400 text-sm">
        <p>&copy; 2026 Családi Videótár</p>
    </footer>

    <script>
        // Itt állíthatod be a fő témaköröket (kategóriákat)
        let dbData = {
            categories: [
                { id: "szuletesek", name: "Születések & Unokák", icon: "fa-baby", image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Abris/2004-1.jpg" },
                { id: "futasok", name: "Futások & Sport", icon: "fa-person-running", image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Gerda/2005-1.jpg" },
                { id: "karacsonyok", name: "Karácsonyok", icon: "fa-tree", image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Moira/2007-1.jpg" },
                { id: "husvetok", name: "Húsvétok", icon: "fa-egg", image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Abris/2003-1.jpg" },
                { id: "egyebek", name: "Egyéb Családi Események", icon: "fa-star", image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Gerda/2004-1.jpg" }
            ],
            users: [
                { username: "admin", password: "19511955", role: "admin" },
                { username: "Timi", password: "Timi1976", role: "admin" },
                { username: "Tomi", password: "Tomi 1977", role: "admin" },
                { username: "Nagymama", password: "Nagymama1955", role: "admin" },
                { username: "Abris", password: "Abris2003", role: "admin" },
                { username: "Gerda", password: "Gerda2004", role: "admin" },
                { username: "Moira", password: "Moir2007", role: "admin" },
                { username: "Liviusz", password: "Liviusz1969", role: "admin" }
            ],
            // ITT TUDOD HOZZÁADNI A VIDEÓKAT (categoryId, year, youtubeId, caption)
            videos: [
                { categoryId: "szuletesek", year: 2003, youtubeId: "dQw4w9WgXcQ", caption: "Ábris első pillanatai 2003-ban" },
                { categoryId: "karacsonyok", year: 2020, youtubeId: "dQw4w9WgXcQ", caption: "Karácsonyi ajándékbontás" },
                { categoryId: "futasok", year: 2025, youtubeId: "dQw4w9WgXcQ", caption: "Családi futóverseny pillanatok" }
            ]
        };

        let currentUser = null;
        let currentCategory = null;

        function initApp() {
            renderNav();
            renderHome();
            openLoginModal();
        }

        function hideAllViews() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('galleryView').classList.add('hidden');
        }

        function showHome() {
            if (!currentUser) {
                openLoginModal();
                return;
            }
            hideAllViews();
            document.getElementById('homeView').classList.remove('hidden');
            renderHome();
        }

        function showCategory(catId) {
            if (!currentUser) {
                openLoginModal();
                showAlert("A videók megtekintéséhez bejelentkezés szükséges!", "bg-amber-600 text-white");
                return;
            }
            hideAllViews();
            document.getElementById('galleryView').classList.remove('hidden');
            renderCategoryGallery(catId);
        }

        function renderNav() {
            const categoryNav = document.getElementById('categoryNav');
            categoryNav.innerHTML = '';
            
            if (currentUser) {
                dbData.categories.forEach(c => {
                    categoryNav.innerHTML += `<button onclick="showCategory('${c.id}')" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 transition font-medium"><i class="fa-solid ${c.icon} mr-1"></i> ${c.name}</button>`;
                });
                categoryNav.classList.remove('hidden');
            } else {
                categoryNav.classList.add('hidden');
            }

            const authNav = document.getElementById('authNav');
            if (currentUser) {
                authNav.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-sm text-amber-300"><i class="fa-solid fa-user-shield mr-1"></i> ${currentUser}</span>
                        <button onclick="logout()" class="px-3 py-1.5 rounded bg-red-600 hover:bg-red-500 text-sm transition">Kilépés</button>
                    </div>
                `;
            } else {
                authNav.innerHTML = `<button onclick="openLoginModal()" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500 font-semibold transition"><i class="fa-solid fa-right-to-bracket mr-1"></i> Belépés</button>`;
            }
        }

        function renderHome() {
            const grid = document.getElementById('homeCategoriesGrid');
            const subText = document.getElementById('homeSubText');
            
            if (!currentUser) {
                grid.classList.add('hidden');
                subText.innerText = "A videók megtekintéséhez bejelentkezés szükséges.";
                return;
            }

            subText.innerText = "Válassz egy témakört a videógyűjtemény megtekintéséhez:";
            grid.innerHTML = '';
            grid.classList.remove('hidden');

            dbData.categories.forEach(c => {
                grid.innerHTML += `
                    <div onclick="showCategory('${c.id}')" class="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-lg cursor-pointer hover:border-amber-400 transition transform hover:-translate-y-1">
                        <div class="w-full h-40 bg-slate-950 flex items-center justify-center overflow-hidden relative">
                            <img src="${c.image}" alt="${c.name}" class="w-full h-40 object-cover opacity-60 transition-transform duration-300 hover:scale-110">
                            <div class="absolute inset-0 flex items-center justify-center bg-black/40">
                                <i class="fa-solid ${c.icon} text-4xl text-amber-400 drop-shadow-md"></i>
                            </div>
                        </div>
                        <div class="p-4">
                            <h3 class="text-lg font-bold text-amber-400">${c.name}</h3>
                            <p class="text-xs text-slate-400 mt-1">Kattints a témához</p>
                        </div>
                    </div>
                `;
            });
        }

        function renderCategoryGallery(catId) {
            if (!currentUser) {
                openLoginModal();
                return;
            }
            currentCategory = catId;
            const category = dbData.categories.find(c => c.id === catId);
            if(!category) return;
            document.getElementById('galleryTitle').innerText = category.name;

            const yearContainer = document.getElementById('yearFilterContainer');
            yearContainer.innerHTML = '';

            // Gyűjtsük össze, mely évekbeli videók tartoznak ehhez a kategóriához
            let catVideos = dbData.videos.filter(v => v.categoryId === catId);
            let years = [...new Set(catVideos.map(v => v.year))].sort((a, b) => a - b);

            if (years.length === 0) {
                // Ha még nincs videó rögzítve, mutassuk az épp aktuális évet alapértelmezetten
                years = [new Date().getFullYear()];
            }

            years.forEach((y, idx) => {
                const isActive = (idx === 0);
                const btnClass = isActive ? "px-3 py-1.5 bg-amber-600 text-white rounded text-sm font-semibold year-btn" : "px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm year-btn";
                yearContainer.innerHTML += `<button onclick="filterYear('${catId}', ${y}, this)" class="${btnClass}">${y}</button>`;
            });

            filterYear(catId, years[0], yearContainer.querySelector('.year-btn'));
        }

        function filterYear(catId, year, clickedBtn) {
            if (!currentUser) return;
            document.querySelectorAll('#yearFilterContainer button').forEach(btn => {
                btn.className = "px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm year-btn";
            });
            if(clickedBtn) clickedBtn.className = "px-3 py-1.5 bg-amber-600 text-white rounded text-sm font-semibold year-btn";

            const gVideos = dbData.videos.filter(v => v.categoryId === catId && v.year == year);
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (gVideos.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Ebben az évben még nincsenek videók ebben a témában.</p>`;
                return;
            }

            gVideos.forEach(v => {
                let thumbUrl = `https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg`;
                grid.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-md flex flex-col justify-between p-4">
                        <div>
                            <div class="relative bg-slate-950 flex items-center justify-center rounded-lg overflow-hidden h-64 cursor-pointer group" onclick="openVideoModal('${v.youtubeId}', '${v.caption}')">
                                <img src="${thumbUrl}" alt="Videó előnézet" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center group-hover:bg-black/20 transition">
                                    <div class="w-16 h-16 bg-amber-600/90 rounded-full flex items-center justify-center text-white text-2xl shadow-lg transform group-hover:scale-110 transition">
                                        <i class="fa-solid fa-play ml-1"></i>
                                    </div>
                                </div>
                                <span class="absolute top-2 right-2 bg-amber-600 text-white text-xs font-bold px-2 py-1 rounded z-10">${v.year}</span>
                            </div>
                            <div class="mt-3"><p class="text-slate-200 text-sm font-medium">${v.caption || ''}</p></div>
                        </div>
                    </div>
                `;
            });
        }

        function openVideoModal(youtubeId, caption) {
            document.getElementById('youtubeIframe').src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
            document.getElementById('videoModalCaption').innerText = caption;
            document.getElementById('videoModal').classList.remove('hidden');
        }

        function closeVideoModal() {
            document.getElementById('youtubeIframe').src = '';
            document.getElementById('videoModal').classList.add('hidden');
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        function handleLogin(event) {
            event.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            
            const foundUser = dbData.users.users ? dbData.users.find(...) : dbData.users.find(user => user.username === u && user.password === p);
            if (foundUser) {
                currentUser = u;
                closeLoginModal();
                renderNav();
                showHome();
                showAlert("Sikeres bejelentkezés!", "bg-green-600 text-white");
            } else {
                alert("Hibás felhasználónév vagy jelszó!");
            }
        }

        function logout() {
            currentUser = null;
            renderNav();
            showHome();
            openLoginModal();
            showAlert("Sikeres kijelentkezés.", "bg-slate-700 text-white");
        }

        function showAlert(msg, className) {
            const box = document.getElementById('alertBox');
            box.className = `mb-4 p-4 rounded-lg text-sm font-medium ${className}`;
            box.innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        initApp();
    </script>
</body>
</html>
