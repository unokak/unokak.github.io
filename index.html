<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unokák fejlődése képekben</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- FELSŐ MENÜSOR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400 cursor-pointer" onclick="showHome()">
                <i class="fa-solid fa-child-reaching mr-2"></i> Unokák Fejlődése
            </h1>
            <nav id="mainNav" class="flex items-center space-x-2 md:space-x-4 mt-2 sm:mt-0">
                <button onclick="showHome()" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 transition"><i class="fa-solid fa-house mr-1"></i> Főoldal</button>
                <div id="grandkidsNav" class="hidden flex space-x-2"></div>
                <div id="authNav">
                    <button onclick="openLoginModal()" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500 font-semibold transition"><i class="fa-solid fa-right-to-bracket mr-1"></i> Belépés</button>
                </div>
            </nav>
        </div>
    </header>

    <!-- FŐ TARTALOMTERÜLET -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
        <div id="alertBox" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

        <!-- 1. FŐOLDAL -->
        <section id="homeView" class="text-center py-12">
            <div class="max-w-3xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
                <h2 class="text-3xl md:text-4xl font-extrabold text-amber-400 mb-4">Üdvözöljük a Családi Fotógalériában!</h2>
                <p id="homeSubText" class="text-slate-300 text-lg mb-8">A galériák és a fotók megtekintéséhez bejelentkezés szükséges.</p>
                <div id="homeGrandkidsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 hidden"></div>
                
                <div id="adminQuickAccess" class="hidden mt-6">
                    <button onclick="showAdminView()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl shadow-lg transition text-lg">
                        <i class="fa-solid fa-gears mr-2"></i> Regisztrált felhasználók listája (Admin)
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. GALÉRIA NÉZET -->
        <section id="galleryView" class="hidden">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-700">
                <h2 id="galleryTitle" class="text-3xl font-bold text-amber-400 mb-4 md:mb-0"></h2>
                <div id="yearFilterContainer" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- 3. ADMIN FELÜLET -->
        <section id="adminView" class="hidden">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                <h2 class="text-2xl font-bold text-blue-400"><i class="fa-solid fa-shield-halved mr-2"></i> Adminisztrációs Vezérlőpult</h2>
                <button onclick="showHome()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">Vissza a főoldalra</button>
            </div>

            <div class="max-w-xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-xl font-bold text-amber-400 mb-4">Rögzített családtagok / felhasználók</h3>
                <div class="mt-4 pt-2">
                    <ul id="userList" class="space-y-2 text-sm text-slate-300"></ul>
                </div>
            </div>
        </section>
    </main>

    <!-- KÉPNAGYÍTÓ (LIGHTBOX) MODAL -->
    <div id="lightboxModal" class="fixed inset-0 bg-black/90 hidden flex flex-col items-center justify-center z-50 p-4" onclick="closeLightbox()">
        <button class="absolute top-4 right-6 text-white text-3xl hover:text-amber-400 transition" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImg" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl mb-3" alt="Nagyított kép">
        <p id="lightboxCaption" class="text-slate-300 text-base text-center"></p>
    </div>

    <!-- BEJELENTKEZÉSI MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold text-amber-400 mb-4"><i class="fa-solid fa-lock mr-2"></i> Bejelentkezés szükséges</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Felhasználónév</label>
                    <input type="text" id="loginUser" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Jelszó</label>
                    <input type="password" id="loginPass" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">Mégse</button>
                    <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 font-bold rounded">Belépés</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-slate-400 text-sm">
        <p>&copy; 2026 Unokák Fejlődése Képekben | Családi Adatbázis</p>
    </footer>

    <script>
        let dbData = {
            grandkids: [
                { id: "abris", name: "Abris", startYear: 2003, image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Abris-elokep.png" },
                { id: "gerda", name: "Gerda", startYear: 2004, image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Gerda-elopep.png" },
                { id: "moira", name: "Moira", startYear: 2007, image: "https://raw.githubusercontent.com/unokak/unokak.github.io/main/Moira-elokep.png" }
            ],
            users: [
                { username: "admin", password: "19511955", role: "admin" },
                { username: "Timi", password: "Timi1976", role: "admin" },
                { username: "Tomi", password: "Tomi1977", role: "admin" },
                { username: "Nagymama", password: "Nagymama1955", role: "admin" },
                { username: "Abris", password: "Abris2003", role: "admin" },
                { username: "Gerda", password: "Gerda2004", role: "admin" },
                { username: "Moira", password: "Moir2007", role: "admin" },
                { username: "Liviusz", password: "Liviusz1969", role: "admin" }
            ],
            photos: []
        };

        let customOrders = JSON.parse(localStorage.getItem('family_gallery_orders') || '{}');

        function generatePhotos() {
            dbData.photos = [];
            dbData.grandkids.forEach(g => {
                for (let year = g.startYear; year <= 2026; year++) {
                    let yearPhotos = [];
                    for (let i = 1; i <= 15; i++) {
                        yearPhotos.push({
                            grandkidId: g.id,
                            year: year,
                            url: `https://raw.githubusercontent.com/unokak/unokak.github.io/main/${g.name}/${year}-${i}.jpg`,
                            caption: `${g.name === 'Abris' ? 'Ábris' : g.name} ${year}. év (${i})`,
                            originalIndex: i
                        });
                    }

                    let orderKey = `${g.id}_${year}`;
                    if (customOrders[orderKey]) {
                        let sorted = [];
                        customOrders[orderKey].forEach(origIdx => {
                            let found = yearPhotos.find(p => p.originalIndex === origIdx);
                            if (found) sorted.push(found);
                        });
                        yearPhotos.forEach(p => {
                            if (!sorted.includes(p)) sorted.push(p);
                        });
                        yearPhotos = sorted;
                    }

                    yearPhotos.forEach((p, idx) => {
                        p.currentIndex = idx + 1;
                        dbData.photos.push(p);
                    });
                }
            });
        }

        let currentUser = null;
        let currentGalleryGrandkid = null;
        let currentGalleryYear = null;

        function initApp() {
            generatePhotos();
            renderNav();
            renderHome();
            openLoginModal();
        }

        function hideAllViews() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('galleryView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
        }

        function showHome() {
            if (!currentUser) {
                openLoginModal();
                return;
            }
            hideAllViews();
            document.getElementById('homeView').classList.remove('hidden');
            renderHome();
        }

        function showGallery(grandkidId) {
            if (!currentUser) {
                openLoginModal();
                showAlert("A galériák megtekintéséhez bejelentkezés szükséges!", "bg-amber-600 text-white");
                return;
            }
            hideAllViews();
            document.getElementById('galleryView').classList.remove('hidden');
            renderGallery(grandkidId);
        }

        function showAdminView() {
            if (!currentUser) {
                openLoginModal();
                return;
            }
            hideAllViews();
            document.getElementById('adminView').classList.remove('hidden');
            renderUserList();
        }

        function renderNav() {
            const grandkidsNav = document.getElementById('grandkidsNav');
            grandkidsNav.innerHTML = '';
            
            if (currentUser) {
                dbData.grandkids.forEach(g => {
                    grandkidsNav.innerHTML += `<button onclick="showGallery('${g.id}')" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 transition font-medium">${g.name === 'Abris' ? 'Ábris' : g.name}</button>`;
                });
                grandkidsNav.classList.remove('hidden');
            } else {
                grandkidsNav.classList.add('hidden');
            }

            const authNav = document.getElementById('authNav');
            if (currentUser) {
                authNav.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-sm text-amber-300"><i class="fa-solid fa-user-shield mr-1"></i> ${currentUser}</span>
                        <button onclick="logout()" class="px-3 py-1.5 rounded bg-red-600 hover:bg-red-500 text-sm transition">Kilépés</button>
                    </div>
                `;
            } else {
                authNav.innerHTML = `<button onclick="openLoginModal()" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500 font-semibold transition"><i class="fa-solid fa-right-to-bracket mr-1"></i> Belépés</button>`;
            }
        }

        function renderHome() {
            const grid = document.getElementById('homeGrandkidsGrid');
            const subText = document.getElementById('homeSubText');
            const adminQuickAccess = document.getElementById('adminQuickAccess');
            
            if (!currentUser) {
                grid.classList.add('hidden');
                adminQuickAccess.classList.add('hidden');
                subText.innerText = "A galériák és a fotók megtekintéséhez bejelentkezés szükséges.";
                return;
            }

            subText.innerText = "Válassz egy unokát a galéria megtekintéséhez:";
            grid.innerHTML = '';
            grid.classList.remove('hidden');
            adminQuickAccess.classList.remove('hidden');

            dbData.grandkids.forEach(g => {
                let displayName = g.name === 'Abris' ? 'Ábris' : g.name;
                grid.innerHTML += `
                    <div onclick="showGallery('${g.id}')" class="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-lg cursor-pointer hover:border-amber-400 transition transform hover:-translate-y-1">
                        <div class="w-full h-48 bg-slate-950 flex items-center justify-center overflow-hidden">
                            <img src="${g.image}" alt="${displayName}" class="w-full h-48 object-contain bg-slate-950 transition-transform duration-300 hover:scale-110" onerror="this.src='https://raw.githubusercontent.com/unokak/unokak.github.io/main/Abris/2004-1.jpg'">
                        </div>
                        <div class="p-4">
                            <h3 class="text-xl font-bold text-amber-400">${displayName}</h3>
                            <p class="text-sm text-slate-400 mt-1">Kattints a fejlődési galériáért</p>
                        </div>
                    </div>
                `;
            });
        }

        function renderGallery(grandkidId) {
            if (!currentUser) {
                openLoginModal();
                return;
            }
            currentGalleryGrandkid = grandkidId;
            const grandkid = dbData.grandkids.find(g => g.id === grandkidId);
            if(!grandkid) return;
            let displayName = grandkid.name === 'Abris' ? 'Ábris' : grandkid.name;
            document.getElementById('galleryTitle').innerText = `${displayName} fejlődése képekben`;

            const yearContainer = document.getElementById('yearFilterContainer');
            yearContainer.innerHTML = '';

            let firstYear = grandkid.startYear;
            for (let y = firstYear; y <= 2026; y++) {
                const isActive = (y === firstYear);
                const btnClass = isActive ? "px-3 py-1.5 bg-amber-600 text-white rounded text-sm font-semibold year-btn" : "px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm year-btn";
                yearContainer.innerHTML += `<button onclick="filterYear('${grandkidId}', ${y}, this)" class="${btnClass}">${y}</button>`;
            }

            filterYear(grandkidId, firstYear, yearContainer.querySelector('.year-btn'));
        }

        function filterYear(grandkidId, year, clickedBtn) {
            if (!currentUser) return;
            currentGalleryGrandkid = grandkidId;
            currentGalleryYear = year;

            document.querySelectorAll('#yearFilterContainer button').forEach(btn => {
                btn.className = "px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm year-btn";
            });
            if(clickedBtn) clickedBtn.className = "px-3 py-1.5 bg-amber-600 text-white rounded text-sm font-semibold year-btn";

            const gPhotos = dbData.photos.filter(p => p.grandkidId === grandkidId && p.year == year);
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (gPhotos.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Ebben az évben még nincsenek képek.</p>`;
                return;
            }

            gPhotos.forEach((p, idx) => {
                let moveButtons = '';
                if (currentUser) {
                    moveButtons = `
                        <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-700 bg-slate-900 p-2 rounded">
                            <span class="text-xs text-slate-400">Sorrend: ${idx + 1}</span>
                            <div class="flex space-x-1">
                                <button onclick="movePhoto('${grandkidId}', ${year}, ${idx}, -1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-amber-400" title="Előrébb"><i class="fa-solid fa-chevron-left"></i></button>
                                <button onclick="movePhoto('${grandkidId}', ${year}, ${idx}, 1)" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-amber-400" title="Hátrább"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-md flex flex-col justify-between p-4 photo-card">
                        <div>
                            <div class="relative bg-slate-950 flex items-center justify-center rounded-lg overflow-hidden h-64 cursor-pointer" onclick="openLightbox('${p.url}', '${p.caption}')">
                                <img src="${p.url}" alt="Kép" class="w-full h-full object-contain bg-slate-950 transition-transform duration-300 hover:scale-110" onerror="this.closest('.photo-card').style.display='none'">
                                <span class="absolute top-2 right-2 bg-amber-600 text-white text-xs font-bold px-2 py-1 rounded z-10">${p.year}</span>
                                <div class="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i> Nagyítás</div>
                            </div>
                            <div class="mt-3"><p class="text-slate-200 text-sm">${p.caption || ''}</p></div>
                        </div>
                        ${moveButtons}
                    </div>
                `;
            });
        }

        function movePhoto(grandkidId, year, index, direction) {
            let orderKey = `${grandkidId}_${year}`;
            let gPhotos = dbData.photos.filter(p => p.grandkidId === grandkidId && p.year == year);
            
            let originalIndices = gPhotos.map(p => p.originalIndex);
            
            let newIndex = index + direction;
            if (newIndex < 0 || newIndex >= originalIndices.length) return;

            let temp = originalIndices[index];
            originalIndices[index] = originalIndices[newIndex];
            originalIndices[newIndex] = temp;

            customOrders[orderKey] = originalIndices;
            localStorage.setItem('family_gallery_orders', JSON.stringify(customOrders));

            generatePhotos();
            filterYear(grandkidId, year, document.querySelector('.year-btn.bg-amber-600'));
            showAlert("Sorrend frissítve!", "bg-green-600 text-white");
        }

        function openLightbox(url, caption) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxCaption').innerText = caption;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function renderUserList() {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            dbData.users.forEach(user => {
                list.innerHTML += `<li class="flex items-center"><i class="fa-solid fa-user mr-2 text-amber-400"></i> ${user.username} <span class="text-xs text-slate-500 ml-2">(jelszó beállítva)</span></li>`;
            });
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        function handleLogin(event) {
            event.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            
            const foundUser = dbData.users.find(user => user.username === u && user.password === p);
            if (foundUser) {
                currentUser = u;
                closeLoginModal();
                renderNav();
                showHome();
                showAlert("Sikeres bejelentkezés!", "bg-green-600 text-white");
            } else {
                alert("Hibás felhasználónév vagy jelszó!");
            }
        }

        function logout() {
            currentUser = null;
            renderNav();
            showHome();
            openLoginModal();
            showAlert("Sikeres kijelentkezés.", "bg-slate-700 text-white");
        }

        function showAlert(msg, className) {
            const box = document.getElementById('alertBox');
            box.className = `mb-4 p-4 rounded-lg text-sm font-medium ${className}`;
            box.innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        initApp();
    </script>
</body>
</html>
